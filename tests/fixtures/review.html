<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cwtch · integration review</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f5f5f7;
        color: #202024;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      h1 {
        font-size: 24px;
      }
      button {
        padding: 12px 18px;
        border: 1px solid #bbb;
        border-radius: 10px;
        background: white;
      }
      #results {
        white-space: pre-wrap;
        line-height: 1.8;
      }
      .frames {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      iframe {
        width: 430px;
        height: 820px;
        border: 0;
        border-radius: 20px;
        background: #141416;
      }
      #controls {
        display: flex;
        gap: 12px;
        margin: 16px 0;
      }
    </style>
  </head>
  <body>
    <h1>Cwtch · local integration review</h1>
    <p>
      Real extension UI and encrypted WebSocket relay. Simulated streaming players and Chrome APIs.
    </p>
    <div id="controls">
      <button id="run">Run two-person scenario</button><button id="chat">Show chat</button
      ><button id="room">Show room</button><button id="moments">Show moments</button>
    </div>
    <div id="results" role="status">Ready to run.</div>
    <div class="frames">
      <iframe title="Sahil’s player" id="a" src="player.html"></iframe
      ><iframe title="Alex’s player" id="b" src="player.html"></iframe>
    </div>
    <script src="scenario.js"></script>
  </body>
</html>
