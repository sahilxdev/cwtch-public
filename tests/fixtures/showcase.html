<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cwtch · room preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141416;
      }
      #a {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #b {
        position: fixed;
        left: -500px;
        width: 430px;
        height: 820px;
        border: 0;
        visibility: hidden;
      }
      #controls {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 2;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        max-width: 140px;
      }
      button {
        font:
          12px -apple-system,
          sans-serif;
        border: 1px solid #555;
        border-radius: 8px;
        padding: 9px 12px;
        background: #242428;
        color: #fafafa;
      }
      #results {
        position: fixed;
        left: 16px;
        bottom: 8px;
        color: #aaa;
        font:
          11px -apple-system,
          sans-serif;
        z-index: 2;
        max-width: 45%;
        display: none;
      }
    </style>
  </head>
  <body>
    <iframe title="Sahil’s simulated player" id="a" src="player.html"></iframe
    ><iframe title="Alex’s simulated player" id="b" src="player.html"></iframe>
    <div id="controls">
      <button id="run">Run preview</button><button id="room">Room</button
      ><button id="chat">Chat</button><button id="moments">Moments</button
      ><button id="dark">Dark</button><button id="light">Light</button>
    </div>
    <div id="results" role="status">Ready.</div>
    <script src="scenario.js"></script>
    <script>
      for (const scheme of ['light', 'dark'])
        document.getElementById(scheme).onclick = () => {
          for (const app of apps()) {
            app.ui.host.style.colorScheme = scheme;
            app.ui.q('.cwtch-panel').style.colorScheme = scheme;
          }
        };
    </script>
  </body>
</html>
