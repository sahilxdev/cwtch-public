services:
  relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    ports:
      - '127.0.0.1:8787:8787'
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      ALLOWED_ORIGINS: 'chrome-extension://*'
      MAX_CONNECTIONS: 5000
      MAX_CONNECTIONS_PER_IP: 100
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
